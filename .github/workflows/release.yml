name: Release

# Push a tag like v0.2.0 to publish binaries for every platform.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2

      - name: Check tag matches build.zig.zon version
        run: |
          version=$(grep -oP '\.version = "\K[^"]+' build.zig.zon)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.zig.zon version $version"
            exit 1
          fi

      - run: zig build test
      - run: zig build release

      - name: Package
        run: |
          mkdir dist
          cd zig-out/release
          for target in *; do
            name="zcli-${GITHUB_REF_NAME}-${target}"
            if [[ "$target" == *windows* ]]; then
              (cd "$target" && zip -q "../../../dist/${name}.zip" zcli.exe)
            else
              tar -czf "../../dist/${name}.tar.gz" -C "$target" zcli
            fi
          done
          cd ../../dist && sha256sum * > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
